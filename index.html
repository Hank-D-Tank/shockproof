<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shockproof. Create desire through disruption</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Cabin:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tweenwind@0.2.0"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #181713;
    color: #f1f1f1;
    font: 14px/20px "Archivo", sans-serif;
    overflow: hidden;
  }

  .hero {
    --inset-y: 23.4vh;
    --inset-x: calc(50vw - 29.4vh);
    position: relative;
    height: 100vh;
    overflow: hidden;
  }

  .nav {
    visibility: hidden;
  }

  .logo {
    position: fixed;
    top: 2vw;
    left: 2vw;
    z-index: 10;
    color: #fff;
    font: 700 1.75vw/1 "Cabin", sans-serif;
    text-decoration: none;
    mix-blend-mode: difference;
    transform: translateY(-300%);
  }

  .links {
    position: fixed;
    top: 2vw;
    right: 2vw;
    z-index: 10;
    display: flex;
    gap: 0.75vw;
    transform: translateY(-300%);
  }

  .button {
    display: flex;
    align-items: center;
    height: 2vw;
    padding: 0.1vw 0.5vw 0 0.4vw;
    border: 1px solid #181713;
    border-radius: 0.6vw;
    background: #f1f1f1cf;
    backdrop-filter: blur(40px);
    color: #000;
    font: 500 1.25vw/1vw "Archivo", sans-serif;
    letter-spacing: -0.07em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
  }

  .layer {
    position: absolute;
    inset: 0;
  }

  .bottom {
    z-index: 1;
    background: #181713;
  }

  .top {
    z-index: 5;
    background: #000;
    filter: hue-rotate(180deg) invert(1);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .frame {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 0;
    height: 0;
    transform: translate(-50%, -50%);
  }

  .photos {
    position: absolute;
    inset: 0;
  }

  .photo {
    position: absolute;
    inset: 0;
    overflow: clip;
    opacity: 0;
    box-shadow: 0 0 0 15em #181713;
  }

  .photo:first-child {
    opacity: 1;
  }

  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo:first-child img {
    clip-path: inset(100% 0 0 0);
  }

  .video {
    position: absolute;
    z-index: 2;
    flex: none;
    width: 100vw;
    height: 100vh;
    opacity: 0;
  }

  .video-clip {
    --burst: 0;
    width: 100%;
    height: 100%;
    clip-path: inset(calc((1 - var(--burst)) * var(--inset-y)) calc((1 - var(--burst)) * var(--inset-x)));
  }

  .video-clip video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .word {
    position: absolute;
    color: #f1f1f1;
    font: 700 2.35vw/1 "Cabin", sans-serif;
    white-space: nowrap;
  }

  .word span {
    display: block;
  }

  .word-left {
    top: 0;
    left: 0;
    transform: translate(-100%, -50%);
  }

  .word-right {
    right: 0;
    bottom: 0;
    transform: translate(100%, 45%);
  }

  .shade {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 2;
    height: 30vw;
    background: linear-gradient(#0000, #000);
    opacity: 0.9;
    transform: scaleY(0);
    transform-origin: 50% 100%;
  }

  .headline {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 3;
    padding: 0 2vw 2vw;
  }

  .mask {
    position: relative;
    display: inline-block;
    overflow: hidden;
  }

  .create {
    top: 0.2vw;
    left: 22.4vw;
  }

  .desire {
    left: 5vw;
  }

  .through {
    left: 30.6vw;
  }

  .disruption {
    left: 37.4vw;
  }

  .big {
    display: block;
    padding: 1vw 0.5vw 0.2vw 0;
    font-size: 7.9vw;
    font-weight: 400;
    line-height: 6.08vw;
    letter-spacing: -0.09em;
    text-transform: uppercase;
  }

  .grey {
    color: #acacac;
  }

  .from-left {
    transform: translateX(-105%);
  }

  .from-right {
    transform: translateX(105%);
  }

  .top .headline {
    z-index: 0;
  }

  .top-video {
    --burst: 0;
    position: absolute;
    inset: 0;
    z-index: 2;
    mix-blend-mode: multiply;
    clip-path: inset(calc((1 - var(--burst)) * var(--inset-y)) calc((1 - var(--burst)) * var(--inset-x)));
  }

  .top-video video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .top .create,
  .top .desire {
    opacity: 0.7;
  }

  .top .through,
  .top .disruption {
    opacity: 0.4;
  }

  @media (min-width: 1920px) {
    .big {
      padding: 1vh 1vh 0.2vw 0;
      font-size: 13.5vh;
      line-height: 10vh;
    }

    .word {
      font-size: 4.4vh;
    }
  }

  @media (max-width: 991px) {
    .logo {
      top: 4vw;
      font-size: 2.4vw;
    }

    .links {
      top: 4vw;
    }

    .button {
      height: 3vw;
      padding: 0.3vw 0.6vw 0;
      border-radius: 1vw;
      font-size: 2.1vw;
      line-height: 2vw;
    }

    .create {
      top: 0.4vw;
    }
  }

  @media (max-width: 479px) {
    .hero {
      --inset-y: calc(50vh - 42vw);
      --inset-x: 20.6vw;
      height: 100svh;
    }

    .logo {
      top: 6vw;
      left: 4vw;
      font-size: 5.9vw;
    }

    .links {
      top: 5vw;
      right: 4vw;
      gap: 2vw;
    }

    .button {
      height: 7vw;
      padding: 0.3vw 1.4vw 0;
      border-radius: 1.6vw;
      font-size: 4.2vw;
      line-height: 4vw;
    }

    .word {
      font-size: 5.3vw;
    }

    .headline {
      padding-bottom: 7vw;
    }

    .row:first-child,
    .row:last-child {
      display: flex;
    }

    .big {
      font-size: 13.5vw;
      line-height: 10.4vw;
    }

    .create {
      top: -0.3vw;
      left: 8.5vw;
    }

    .desire {
      left: 1.5vw;
    }

    .disruption {
      left: 21.4vw;
    }
  }
</style>
</head>
